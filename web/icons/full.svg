  <rect width="512" height="512" fill="#060709" />
  <g transform="translate(256 262) scale(8.5) translate(-16 -16.5)">
    <polygon points="16,8 25.5,25 6.5,25" fill="#ff7a3d" stroke="#ff7a3d" stroke-width="10" stroke-linejoin="round" />
    <ellipse cx="11.5" cy="19.5" rx="2.4" ry="3.4" fill="#fff" />
    <ellipse cx="20.5" cy="19.5" rx="2.4" ry="3.4" fill="#fff" />
  </g>
</svg>
