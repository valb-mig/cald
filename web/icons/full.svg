<!-- O ícone de ponta a ponta, para quem recorta o próprio formato (o maskable do Android e o do
     iPhone): o mesmo branco com a luz de cima e o ".r" de icon.svg, na metade do tamanho, dentro do
     círculo que nunca é cortado. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" />
      <stop offset="0.45" stop-color="#f4f4f5" />
      <stop offset="1" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fundo)" />
  <g transform="scale(0.5)">
  <g transform="translate(-69 -8)" fill="none" stroke="#0d0d0f" stroke-width="116" stroke-linecap="round">
    <circle cx="408" cy="636" r="64" fill="#0d0d0f" stroke="none" />
    <path d="M600 398V642" />
    <path d="M600 560C600 450 650 398 760 398" />
  </g>
  </g>
</svg>
