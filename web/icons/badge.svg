<!-- Badge da notificação: o Android só usa a transparência, então é a silhueta branca do claudinho de
     icon.svg, com os olhos vazados e sem a sombra, que some nesse tamanho. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <mask id="olhos" maskUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40">
      <rect x="-4" y="-4" width="40" height="40" fill="#fff" />
      <ellipse cx="11.5" cy="19.5" rx="2.4" ry="3.4" fill="#000" />
      <path d="M18 20.8Q20.5 16.7 23 20.8" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" />
    </mask>
  </defs>
  <g transform="translate(48 48) scale(2.5) translate(-14 -20)">
    <g transform="rotate(-8 16 30)">
      <!-- As perninhas abertas em V, de quem saiu do chão. -->
      <rect x="9.4" y="25" width="3.6" height="10.5" rx="1.8" fill="#fff" transform="rotate(14 11.2 26)" />
      <rect x="18.4" y="25" width="3.6" height="10.5" rx="1.8" fill="#fff" transform="rotate(-24 20.2 26)" />
      <!-- Um bracinho aberto, para o equilíbrio; o outro lá em cima, acenando. -->
      <ellipse cx="2.2" cy="19.8" rx="2.6" ry="3.8" fill="#fff" transform="rotate(-40 2.2 19.8)" />
      <ellipse cx="25.8" cy="10.5" rx="2.6" ry="4" fill="#fff" transform="rotate(28 25.8 10.5)" />
          <g mask="url(#olhos)">
        <polygon points="16,8 25.5,25 6.5,25" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
