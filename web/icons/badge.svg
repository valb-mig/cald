<!-- Badge da notificação: o Android só usa a transparência e o mostra pequeno, na barra de status.
     Então é a silhueta da gota de favicon.svg, sem bracinhos nem perninhas, com os olhos vazados. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <mask id="olhos" maskUnits="userSpaceOnUse" x="-4" y="-4" width="40" height="40">
      <rect x="-4" y="-4" width="40" height="40" fill="#fff" />
      <ellipse cx="10.8" cy="19.6" rx="3.3" ry="4.5" fill="#000" />
      <ellipse cx="21.2" cy="19.6" rx="3.3" ry="4.5" fill="#000" />
    </mask>
  </defs>
  <g transform="translate(48 49) scale(2.9) translate(-16 -16.5)" mask="url(#olhos)">
    <polygon points="16,8 25.5,25 6.5,25" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round" />
  </g>
</svg>
