# O app do PC (desktop/). Nos PRs que mexem nele, compila os pacotes para conferir, sem publicar. A
# cada tag v* (a versão do desktop/package.json), publica o AppImage, o .deb e o .pacman nos
# Releases, com o latest-linux.yml de onde o app instalado procura a versão nova.
name: App do PC

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - desktop/**
      - server/**
      - web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/desktop.yml

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # O bsdtar monta o .pacman.
      - run: sudo apt-get install -y --no-install-recommends libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # O Electron e as ferramentas do empacotamento vêm pela API, autenticados: os downloads
      # anônimos dos Releases do GitHub podem falhar em massa (ver o script).
      - name: Electron e ferramentas, pela API
        run: desktop/scripts/seed-downloads.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: A tag é a versão do app
        if: github.event_name == 'push'
        run: |
          version="v$(node -p "require('./desktop/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão do desktop/package.json ($version)." >&2
            exit 1
          fi

      - name: Pacotes, sem publicar
        if: github.event_name == 'pull_request'
        run: pnpm --filter editr-desktop dist

      - name: Publicar nos Releases
        if: github.event_name == 'push'
        run: pnpm --filter editr-desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
